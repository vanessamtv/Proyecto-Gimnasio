# =============================== IMPERIUM CROSS - Configuracion ===============================
spring.application.name=gimnasio

# ---- Base de datos H2 (archivo local, no necesita instalar nada) ----
# Los datos quedan guardados en ./data/fitgym.mv.db entre ejecuciones.
spring.datasource.url=jdbc:h2:file:./data/fitgym;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Consola web de H2 (util para revisar las tablas): http://localhost:8080/h2-console
# JDBC URL a usar en la consola: jdbc:h2:file:./data/fitgym
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Para usar MySQL en vez de H2 mas adelante, comenta el bloque H2 de arriba ----
# ---- y descomenta este bloque (requiere tener MySQL corriendo en localhost:3306) ----
# spring.datasource.url=jdbc:mysql://localhost:3306/fitgym_db?useSSL=false&serverTimezone=America/Lima&createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true

# ---- Servidor ----
server.port=8080
