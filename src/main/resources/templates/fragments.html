<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'IMPERIUM CROSS | ' + ${titulo}">IMPERIUM CROSS</title>
    <link rel="icon" th:href="@{/img/logo-mark.png}">

    <style>
        :root {
            --red: #c72c39;
            --ink: #17191e;
            --muted: #69707e;
            --line: #e6e8ed;
            --bg: #f4f5f8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        a { color: inherit; text-decoration: none; }
        button, input, select { font: inherit; }
        h1, h2, h3, p { margin: 0; }

        a:focus-visible, button:focus-visible,
        input:focus-visible, select:focus-visible,
        [tabindex]:focus-visible {
            outline: 3px solid #c72c3970;
            outline-offset: 3px;
        }

        h1 {
            font-size: clamp(28px, 3.4vw, 44px);
            font-weight: 750;
            line-height: 1.15;
            letter-spacing: -1.5px;
        }

        h2 { font-size: 20px; line-height: 1.35; letter-spacing: -.5px; }
        h3 { font-size: 19px; line-height: 1.3; }

        .container {
            width: min(1200px, calc(100% - 48px));
            margin: auto;
        }

        .page {
            padding: 36px 0 64px;
            min-height: calc(100vh - 166px);
        }

        .muted { color: var(--muted); }
        .small-text { font-size: 12px; }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 800;
            color: var(--red);
            margin-bottom: 10px;
        }

        /* Navegación */
        .site-nav {
            background: #15171c;
            color: white;
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid #ffffff12;
        }

        .nav-inner {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .brand img { width: 42px; height: 42px; object-fit: contain; }
        .brand em { font-style: normal; color: #ff7380; }

        .brand small {
            display: block;
            color: #a0a6b3;
            font-size: 8px;
            letter-spacing: 3px;
            margin-top: 6px;
        }

        .nav-links { display: flex; gap: 6px; }

        .nav-links a {
            color: #c7cbd5;
            padding: 10px 17px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
        }

        .nav-links a:hover { background: #ffffff0a; color: white; }

        .nav-links a[aria-current="page"] {
            background: #ffffff12;
            color: white;
            box-shadow: inset 0 -2px 0 #e64350;
        }

        .menu-toggle {
            display: none;
            border: 1px solid #ffffff30;
            background: transparent;
            color: white;
            border-radius: 8px;
            padding: 8px 13px;
        }

        .skip-link {
            position: fixed;
            top: -80px;
            left: 16px;
            z-index: 100;
            background: white;
            color: var(--ink);
            padding: 12px;
            border-radius: 8px;
        }

        .skip-link:focus { top: 10px; }

        /* Encabezados y botones */
        .page-heading, .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px;
        }

        .page-heading .muted { margin-top: 12px; }
        .section-heading { margin-top: 44px; }
        .section-heading h2 { font-size: 27px; }

        .actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .end { justify-content: flex-end; }
        .nowrap { flex-wrap: nowrap; }
        .right { text-align: right; }
        .full { width: 100%; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 11px 19px;
            border-radius: 9px;
            border: 1px solid transparent;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: background .2s, transform .2s;
            white-space: nowrap;
        }

        .btn:hover { transform: translateY(-1px); }

        .primary {
            background: var(--red);
            color: white;
            box-shadow: 0 5px 12px #c72c3915;
        }

        .primary:hover { background: #ac2130; }

        .secondary {
            background: white;
            color: var(--ink);
            border-color: #dfe2e8;
        }

        .secondary:hover { background: #f1f3f6; }

        .light {
            color: white;
            background: #ffffff12;
            border-color: #ffffff38;
        }

        .light:hover { background: #ffffff22; }
        .ghost { color: var(--muted); background: transparent; }

        .danger {
            color: #a51c2a;
            background: #fff2f3;
            border-color: #f6d7dc;
        }

        .danger:hover { background: #ffe1e5; }
        .small { min-height: 35px; padding: 7px 12px; font-size: 12px; }

        /* Tarjetas y tablas */
        .card {
            background: white;
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 5px 22px #17191e03;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 24px 26px;
            border-bottom: 1px solid var(--line);
        }

        .toolbar .muted {
            display: block;
            margin-top: 4px;
            font-size: 12px;
        }

        .toolbar .eyebrow { margin-bottom: 4px; }
        .search { display: flex; align-items: center; gap: 8px; }
        .search input { width: 250px; }
        .table-wrap { width: 100%; overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #fafbfc;
            color: #737b89;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 16px 24px;
            font-weight: 750;
        }

        td {
            border-top: 1px solid #eff0f3;
            padding: 18px 24px;
            font-size: 13px;
        }

        tbody tr:hover { background: #fcfcfe; }

        .mono {
            font-variant-numeric: tabular-nums;
            color: #626a79;
        }

        .cell-sub {
            display: block;
            color: var(--muted);
            margin-top: 4px;
        }

        .name-link { font-weight: 700; }
        a.name-link:hover, a.person:hover { color: var(--red); }
        .person { display: flex; align-items: center; gap: 12px; }

        .avatar {
            display: grid;
            place-items: center;
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: #f9eaec;
            color: var(--red);
            font-weight: 800;
        }

        .avatar.large {
            width: 74px;
            height: 74px;
            font-size: 28px;
            border-radius: 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .success { background: #e8f5ef; color: #20734b; }
        .warning { background: #fff4dc; color: #876213; }
        .neutral { background: #eef0f4; color: #69707e; }

        .plan-chip {
            display: inline-block;
            border: 1px solid #e5e7ed;
            border-radius: 6px;
            padding: 3px 9px;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .price { font-weight: 750; }

        .empty {
            text-align: center;
            padding: 44px 20px;
            white-space: normal;
        }

        .empty strong { display: block; font-size: 15px; }

        .empty span {
            display: block;
            color: var(--muted);
            margin-top: 7px;
            font-size: 13px;
        }

        /* Inicio */
        .hero {
            border-radius: 24px;
            min-height: 385px;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(90deg, #101217f5 0%, #101217d9 40%, #10121730 100%),
                url('/img/entrenamiento.jpg') center / cover;
            color: white;
            display: flex;
            align-items: center;
            padding: 48px;
        }

        .hero-content { max-width: 630px; position: relative; z-index: 1; }
        .hero .eyebrow { color: #ffa4ad; }

        .hero h1 {
            font-size: clamp(34px, 4vw, 55px);
            letter-spacing: -2px;
        }

        .hero h1 span { color: #ff8792; }

        .hero-content > p:not(.eyebrow) {
            color: #c5c8d1;
            max-width: 480px;
            font-size: 14px;
            margin: 20px 0 28px;
        }

        .hero-tag {
            position: absolute;
            bottom: 26px;
            right: 28px;
            background: #15171caa;
            border: 1px solid #ffffff20;
            border-radius: 30px;
            padding: 8px 13px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #36996a;
            box-shadow: 0 0 0 3px #36996a15;
            flex-shrink: 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-top: 22px;
        }

        .stat {
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: white;
            transition: transform .2s;
        }

        .stat:hover { transform: translateY(-3px); }
        .stat > span { color: var(--muted); font-size: 12px; font-weight: 600; }

        .stat strong {
            display: block;
            font-size: 40px;
            letter-spacing: -1px;
            line-height: 1.4;
            margin: 8px 0;
        }

        .stat small { color: #9299a5; font-size: 11px; }

        .stat-dark {
            background: var(--ink);
            color: white;
            border-color: var(--ink);
        }

        .stat-dark > span { color: #bcc2cd; }
        .stat .live-dot { margin-right: 5px; }

        .zones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .zone {
            height: 240px;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: var(--ink);
            color: white;
        }

        .zone::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent 15%, #111319df 100%);
        }

        .zone img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            transition: transform .4s;
        }

        .zone:hover img { transform: scale(1.04); }

        .zone div {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 16px;
            z-index: 1;
        }

        .zone span {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1.7px;
            color: #eab7bd;
        }

        .zone h3 { margin-top: 8px; }

        /* Formularios */
        .back-link {
            display: inline-block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 22px;
        }

        .back-link:hover { color: var(--red); }

        .form-layout {
            display: grid;
            grid-template-columns: .8fr 1.5fr;
            gap: 24px;
            align-items: stretch;
        }

        .form-aside {
            background: linear-gradient(150deg, #252930, #14161c);
            color: white;
            border-radius: 18px;
            padding: 38px;
            position: relative;
            overflow: hidden;
        }

        .form-aside::after {
            content: "IC";
            position: absolute;
            bottom: 0;
            right: -8px;
            font-size: 170px;
            font-weight: 900;
            line-height: 1;
            color: #ffffff04;
            pointer-events: none;
        }

        .form-aside .eyebrow { color: #ef8993; }

        .form-aside h2 {
            font-size: 32px;
            line-height: 1.2;
            margin: 26px 0 18px;
            letter-spacing: -1px;
        }

        .form-aside p:not(.eyebrow) {
            color: #b5bbc6;
            font-size: 13px;
            max-width: 290px;
        }

        .aside-note {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 50px;
            font-size: 9px;
            letter-spacing: 1.5px;
            color: #d3d7e0;
            border-top: 1px solid #ffffff12;
            padding-top: 24px;
        }

        .membership-aside {
            background: linear-gradient(145deg, #67252e, #1b1c23);
        }

        .form-card { padding: 30px; }
        .form-heading { margin-bottom: 26px; }
        .form-heading .muted { font-size: 12px; margin-top: 7px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 22px;
        }

        .field { margin-bottom: 22px; min-width: 0; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        label span { color: var(--red); }

        input, select {
            width: 100%;
            border: 1px solid #dfe2e8;
            background: #fcfcfd;
            color: var(--ink);
            border-radius: 9px;
            min-height: 45px;
            padding: 11px 13px;
            transition: border .2s;
        }

        input::placeholder { color: #9ca2af; }
        input:focus, select:focus { border-color: var(--red); background: white; }
        .invalid { border-color: var(--red); }

        .field-error {
            display: block;
            color: #ac2130;
            margin-top: 6px;
            font-size: 11px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
            margin-top: 8px;
        }

        .price-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px;
            background: #f8f0f1;
            border: 1px solid #f2dce0;
            border-radius: 12px;
            margin: 6px 0 14px;
        }

        .price-preview .eyebrow { display: block; margin-bottom: 5px; }
        .price-preview small { color: var(--muted); font-size: 11px; }

        .price-preview output {
            font-size: 24px;
            font-weight: 800;
            color: var(--red);
            text-align: right;
        }

        .info-note {
            background: #f6f7fa;
            border-radius: 9px;
            color: var(--muted);
            padding: 17px;
            font-size: 12px;
            margin-bottom: 22px;
        }

        /* Asistencias y ficha */
        .attendance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .attendance-grid .form-card { display: flex; flex-direction: column; }
        .attendance-grid .full { margin-top: auto; }

        .step-icon {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            color: var(--red);
            background: #f9eaec;
            font-size: 22px;
            margin-bottom: 16px;
        }

        .step-icon.dark { color: white; background: var(--ink); }
        .section-gap { margin-top: 24px; }

        .profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 30px;
        }

        .profile-main {
            display: flex;
            align-items: center;
            gap: 22px;
            min-width: 0;
        }

        .profile h1 { font-size: 30px; overflow-wrap: anywhere; }

        .profile-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            color: var(--muted);
            font-size: 12px;
            margin-top: 12px;
        }

        .profile-meta span { overflow-wrap: anywhere; }

        .membership-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 24px;
            padding: 28px 32px;
            border-radius: 16px;
            background: linear-gradient(110deg, #20242c, #32303a);
            color: white;
        }

        .membership-banner .eyebrow { color: #ff9ba6; }
        .membership-banner h2 { font-size: 26px; }

        .membership-banner p:not(.eyebrow) {
            color: #c0c5cf;
            font-size: 12px;
            margin-top: 6px;
        }

        .days { text-align: right; white-space: nowrap; }
        .days strong { font-size: 38px; line-height: 1.2; }
        .days span { display: block; font-size: 11px; color: #c0c5cf; }

        /* Mensajes y pie */
        .alert {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 13px;
        }

        .alert.error { background: #fcecee; color: #a51c2a; }
        .message-area .alert { margin-top: 20px; }

        .alert-close {
            border: 0;
            background: transparent;
            color: inherit;
            font-size: 20px;
            cursor: pointer;
            padding: 0 7px;
        }

        .footer {
            border-top: 1px solid var(--line);
            padding: 24px 0;
            background: white;
        }

        .footer-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            color: var(--muted);
            font-size: 11px;
        }

        .footer strong { color: var(--ink); letter-spacing: 1px; font-size: 12px; }
        .footer span { display: block; }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Adaptación a celulares */
        @media (max-width: 1000px) {
            .zones { grid-template-columns: repeat(2, 1fr); }
            .toolbar { flex-wrap: wrap; }
            .form-aside { padding: 28px; }
            .profile { align-items: flex-start; flex-direction: column; }
            .hero-tag { display: none; }
        }

        @media (max-width: 760px) {
            .container { width: calc(100% - 32px); }
            .page { padding: 26px 0 40px; }
            .nav-inner { min-height: 68px; flex-wrap: wrap; gap: 0; }
            .brand { font-size: 14px; }
            .brand img { width: 35px; height: 35px; }
            .menu-toggle { display: block; }

            .nav-links {
                display: none;
                flex-basis: 100%;
                padding: 12px 0 16px;
                flex-direction: column;
            }

            .nav-links.open { display: flex; }

            .page-heading, .section-heading {
                align-items: flex-start;
                flex-direction: column;
                gap: 16px;
            }

            h1 { letter-spacing: -1px; }
            .hero { padding: 30px 24px; min-height: 360px; }
            .hero h1 { font-size: 36px; }
            .stats { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .stat { padding: 18px; }
            .stat strong { font-size: 32px; }
            .stat > span { font-size: 11px; }
            .form-layout { grid-template-columns: 1fr; }
            .form-aside { display: none; }
            .attendance-grid { grid-template-columns: 1fr; }
            .form-card { padding: 24px; }
            .toolbar { padding: 20px; }
            .search { width: 100%; flex-wrap: wrap; }
            .search input { flex: 1; min-width: 130px; width: auto; }
            .profile { padding: 24px; }
            .profile-main { gap: 14px; }
            .profile h1 { font-size: 24px; }
            .avatar.large { width: 56px; height: 56px; border-radius: 14px; }
            .membership-banner { padding: 24px; }
            .footer-inner { align-items: flex-start; flex-direction: column; gap: 8px; }
        }

        @media (max-width: 440px) {
            .form-grid { grid-template-columns: 1fr; }
            .zones { gap: 12px; }
            .zone { height: 210px; }
            .zone div { left: 14px; bottom: 16px; }
            .zone h3 { font-size: 16px; }
            .zone span { font-size: 7px; }
            .form-actions { flex-direction: column-reverse; }
            .form-actions .btn, .hero .actions .btn { width: 100%; }
            .price-preview { align-items: flex-start; flex-direction: column; }
            .membership-banner { align-items: flex-start; flex-direction: column; }
            .days { text-align: left; }
            .days strong { font-size: 30px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>
<nav th:fragment="nav" class="site-nav" aria-label="Navegación principal">
    <a class="skip-link" href="#contenido">Ir al contenido</a>

    <div class="container nav-inner">
        <a class="brand" th:href="@{/}">
            <img th:src="@{/img/logo-mark.png}" alt="">
            <span>
                IMPERIUM <em>CROSS</em>
                <small>GESTIÓN DEL BOX</small>
            </span>
        </a>

        <button class="menu-toggle" type="button"
                aria-expanded="false" aria-controls="nav-links">
            Menú ☰
        </button>

        <div class="nav-links" id="nav-links">
            <a th:href="@{/}" data-nav="/">Inicio</a>
            <a th:href="@{/clientes}" data-nav="/clientes">Clientes</a>
            <a th:href="@{/membresias}" data-nav="/membresias">Membresías</a>
            <a th:href="@{/asistencias}" data-nav="/asistencias">Asistencias</a>
        </div>
    </div>
</nav>

<div th:fragment="mensajes" class="container message-area">
    <div th:if="${mensaje}" class="alert success" role="status">
        <span th:text="${mensaje}"></span>
        <button type="button" class="alert-close" aria-label="Cerrar mensaje">×</button>
    </div>

    <div th:if="${error}" class="alert error" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="alert-close" aria-label="Cerrar error">×</button>
    </div>
</div>

<footer th:fragment="footer" class="footer">
    <div class="container footer-inner">
        <div>
            <strong>IMPERIUM CROSS</strong>
            <span>La constancia construye resultados.</span>
        </div>
        <span>Sistema de gestión · Clientes / Membresías / Asistencias</span>
    </div>

    <script>
        (() => {
            const menu = document.querySelector('.menu-toggle');
            const links = document.getElementById('nav-links');

            const closeMenu = () => {
                links?.classList.remove('open');
                menu?.setAttribute('aria-expanded', 'false');
            };

            menu?.addEventListener('click', () => {
                const open = links.classList.toggle('open');
                menu.setAttribute('aria-expanded', String(open));
            });

            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && links?.classList.contains('open')) {
                    closeMenu();
                    menu.focus();
                }
            });

            document.querySelectorAll('[data-nav]').forEach(link => {
                const path = new URL(link.href, location.href)
                    .pathname.replace(/\/$/, '') || '/';

                const current = location.pathname.replace(/\/$/, '') || '/';

                if (current === path ||
                    (path !== '/' && current.startsWith(path + '/'))) {
                    link.setAttribute('aria-current', 'page');
                }

                link.addEventListener('click', closeMenu);
            });

            document.querySelectorAll('.alert-close').forEach(button => {
                button.addEventListener('click', () => {
                    button.closest('.alert').remove();
                });
            });

            const form = document.getElementById('membership-form');
            if (!form) return;

            const output = document.getElementById('plan-price');
            let request = 0;

            async function updatePrice() {
                const ticket = ++request;
                output.textContent = 'Consultando…';

                const url = new URL(form.dataset.priceUrl, location.href);

                url.search = new URLSearchParams({
                    plan: form.elements.plan.value,
                    gimnasio: form.elements.gimnasio.value
                });

                try {
                    const response = await fetch(url, {
                        headers: { Accept: 'text/plain' }
                    });

                    if (!response.ok) throw new Error('Precio no disponible');

                    const raw = (await response.text()).trim();
                    const price = Number(raw);

                    if (!raw || !Number.isFinite(price)) {
                        throw new Error('Precio inválido');
                    }

                    if (ticket === request) {
                        output.textContent = 'S/ ' + price.toFixed(2);
                    }
                } catch (error) {
                    if (ticket === request) {
                        output.textContent = 'Se calcula al guardar';
                    }
                }
            }

            form.elements.plan.addEventListener('change', updatePrice);
            form.elements.gimnasio.addEventListener('change', updatePrice);
            updatePrice();
        })();
    </script>
</footer>
</body>
</html>
